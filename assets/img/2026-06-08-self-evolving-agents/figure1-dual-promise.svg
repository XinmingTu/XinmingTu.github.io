  <path d="M78 210 C260 216 560 280 828 330" fill="none" stroke="#2563d6" stroke-width="3.2" stroke-linecap="round"></path>
  <circle cx="828" cy="330" r="4.5" fill="#2563d6"></circle>

  <circle cx="78" cy="210" r="5" fill="#fff" stroke="#1a1d26" stroke-width="2"></circle>
  <text x="86" y="190" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#7a8196">deployment</text>

  <text x="500" y="108" text-anchor="middle" font-size="16.5" font-weight="700" fill="#7c3aed">Capability ↑</text>
  <text x="500" y="126" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#7c3aed">longer task horizons</text>
  <text x="500" y="296" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2563d6">Cost per task ↓</text>
  <text x="500" y="314" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#2563d6">fewer tokens · retries · human fixes</text>
  <text x="782" y="198" text-anchor="end" font-size="16" font-weight="700" fill="#9aa1b5">Static agent</text>

