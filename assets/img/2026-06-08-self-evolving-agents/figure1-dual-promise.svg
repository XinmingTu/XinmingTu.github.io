  <path d="M836 365.5 L849 370 L836 374.5 Z" fill="#3d4250"></path>

  <path d="M78 210 C260 204 560 150 828 64 L828 210 Z" fill="#f4eefd" opacity=".6"></path>
  <path d="M78 210 C260 216 560 280 828 330 L828 210 Z" fill="#eef3fd" opacity=".6"></path>

  <path d="M84 210 H820" fill="none" stroke="#aab0c0" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"></path>

