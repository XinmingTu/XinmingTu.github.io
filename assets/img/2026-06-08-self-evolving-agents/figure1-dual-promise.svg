<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 880 442" width="880" height="442" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,sans-serif" aria-label="Capability rises while cost per task falls">

<rect width="100%" height="100%" fill="#ffffff"></rect>


