<text x="594" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Collective harness tuning</text>
<text x="594" y="182" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">Pipeline gains from shared,</text>
<text x="594" y="197" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">aggregated feedback.</text>

