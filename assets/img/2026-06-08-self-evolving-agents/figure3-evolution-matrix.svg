<text x="862" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Personalized fine-tuning</text>
<text x="862" y="312" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">LoRA &amp; preference adaptation</text>
<text x="862" y="327" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">for one person.</text>


