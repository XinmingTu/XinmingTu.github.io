<text x="862" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Continual learning</text>
<text x="862" y="182" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">Foundation-model updates from</text>
<text x="862" y="197" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">the whole population.</text>


<g color="#1a1d26"><svg stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="24" height="24" x="106" y="240"><rect x="3" y="4.5" width="18" height="16" rx="2.2"></rect><path d="M3 9h18M8 2.5v4M16 2.5v4"></path><path d="M8 13h2M14 13h2M8 16.5h2M14 16.5h2"></path></svg></g>
