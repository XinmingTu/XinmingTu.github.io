<text x="326" y="457" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">KV-cache-like context.</text>

<g color="#df7a18"><svg stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="34" height="34" x="577" y="366"><path d="M3 14a2 2 0 0 0 2 2h2l3 3v-3h3a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"></path><path d="M14.5 9H19a2 2 0 0 1 2 2v3"></path><path d="M21 14l-1.6-1.6M21 14l-1.6 1.6"></path></svg></g>
<text x="594" y="424" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Dynamic task adaptation</text>
<text x="594" y="442" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">On-the-fly prompt or</text>
<text x="594" y="457" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">step-order adjustment.</text>

<g color="#7c3aed"><svg stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="34" height="34" x="845" y="366"><rect x="5" y="5" width="14" height="14" rx="2.2"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect><path d="M9 2.5v2.5M15 2.5v2.5M9 19v2.5M15 19v2.5M2.5 9H5M2.5 15H5M19 9h2.5M19 15h2.5"></path></svg></g>
<text x="862" y="424" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Rare online adaptation</text>
<text x="862" y="442" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">Snapshot tuning mid-run —</text>
<text x="862" y="457" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">powerful but seldom used.</text>


