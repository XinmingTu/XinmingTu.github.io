<text x="326" y="327" text-anchor="middle" font-family="&#39;Source Serif 4&#39;,Georgia,serif" font-size="11.5" fill="#3d4250">carry across sessions.</text>

<g color="#df7a18"><svg stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="34" height="34" x="577" y="236"><circle cx="8" cy="8" r="3"></circle><path d="M3 19v-.5a5 5 0 0 1 5-5"></path><path d="M14 9h6v5"></path><path d="M20 9l-6 6-2.5-2.5"></path></svg></g>
<text x="594" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1d26">Personalized harness</text>
